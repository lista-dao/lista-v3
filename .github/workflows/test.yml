name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        # Pinned: foundry-toolchain@v1 tracks latest stable. From 1.8.1 dynamic_test_linking
        # defaults on and generates abicoder-v1 script helpers that cannot inherit
        # NonfungiblePositionManager (abicoder v2). 1.7.1 is the last version CI was green on.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Install node_modules
        run: yarn install --frozen-lockfile

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      # Surfaces storage-layout drift for the upgradeable contracts on every run
      # so proxy-incompatible changes show up in the PR log.
      - name: Dump proxy storage layouts
        run: |
          echo "::group::ListaV3Factory"
          forge inspect ListaV3Factory storage-layout
          echo "::endgroup::"
          echo "::group::NonfungiblePositionManager"
          forge inspect NonfungiblePositionManager storage-layout
          echo "::endgroup::"
